<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar no MindFlow AI</title>
  <link rel="stylesheet" href="login-panel.css">
</head>
<body>
  <form id="loginForm">
    <div class="heading"><strong>Entrar no MindFlow AI</strong><small>Use a mesma conta do site.</small></div>
    <label>E-mail<input id="email" type="email" autocomplete="email" required></label>
    <label>Senha<input id="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" id="loginButton">Entrar e sincronizar</button>
    <p id="status" role="status"></p>
  </form>
  <script src="login-panel.js"></script>
</body>
</html>
